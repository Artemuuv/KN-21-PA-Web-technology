<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 9</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="todo-container">
        <h1>Мій To-Do List</h1>
        
        <div class="input-section">
            <input type="text" id="task-input" placeholder="Що потрібно зробити?">
            <button id="add-btn">Додати</button>
        </div>

        <div class="controls-section">
            <button id="sort-btn">🔄 Сортувати за датою додавання</button>
        </div>

        <ul id="task-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
