<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 8</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Список справ</h1>
        
        <table id="todo-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Назва завдання</th>
                    <th>Статус</th>
                </tr>
            </thead>
            <tbody id="todo-body">
                <tr><td colspan="3" class="loading">Завантаження даних...</td></tr>
            </tbody>
        </table>
        
        <button id="btn-refresh" class="btn-primary">🔄 Оновити дані</button>

        <div class="add-form-container">
            <h2>Додати нову справу</h2>
            <form id="add-todo-form">
                <div class="form-group">
                    <label for="todo-title">Завдання:</label>
                    <input type="text" id="todo-title" placeholder="Що потрібно зробити?" required>
                </div>
                
                <div class="form-group checkbox-group">
                    <label for="todo-status">Вже виконано?</label>
                    <input type="checkbox" id="todo-status">
                </div>
                
                <button type="submit" class="btn-success">➕ Добавити</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
