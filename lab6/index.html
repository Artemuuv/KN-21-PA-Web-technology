<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 6</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <div class="form-container">
            <h2>Форма реєстрації</h2>
            <form id="registration-form">
                <div class="form-group">
                    <label for="username">Ім'я:</label>
                    <input type="text" id="username" name="username">
                    <span class="error-message" id="username-error"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="text" id="email" name="email">
                    <span class="error-message" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password">Пароль:</label>
                    <input type="password" id="password" name="password">
                    <span class="error-message" id="password-error"></span>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Повторіть пароль:</label>
                    <input type="password" id="confirm-password" name="confirm-password">
                    <span class="error-message" id="confirm-password-error"></span>
                </div>

                <div class="form-group">
                    <label for="age">Вік:</label>
                    <input type="number" id="age" name="age">
                    <span class="error-message" id="age-error"></span>
                </div>

                <div class="form-group">
                    <label for="student-group">Група студентів:</label>
                    <select id="student-group" name="student-group">
                        <option value="">-- Виберіть групу --</option>
                        <option value="IT-101">ІТ-101</option>
                        <option value="IT-102">ІТ-102</option>
                        <option value="IT-103">ІТ-103</option>
                        <option value="IT-104">ІТ-104</option>
                    </select>
                    <span class="error-message" id="group-error"></span>
                </div>

                <button type="submit">Зареєструватися</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
