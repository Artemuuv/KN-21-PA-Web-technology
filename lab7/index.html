<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна 7</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Лабораторна 7</h1>

        <section>
            <h2>Завдання 1: Зміна кольору кнопки</h2>
            <button class="button">Наведи та клікни</button>
        </section>

        <section>
            <h2>Завдання 2: Розгортання блоку</h2>
            <div class="content-wrapper">
                Наведи курсор на мене ⬇️
                <div class="content">
                    <p>Це прихований текст! Він плавно з'являється завдяки зміні max-height та CSS-переходам.</p>
                </div>
            </div>
        </section>

        <section>
            <h2>Завдання 3: Рух блоку</h2>
            <div class="box"></div>
        </section>

        <section>
            <h2>Індивідуальне завдання</h2>
            <button id="start-animation">Запустити рух кола</button>
            <p><em>Колір кола буде змінюватись автоматично кожні 21 секунду.</em></p>
            <div class="circle-container">
                <div class="circle" id="circle"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
